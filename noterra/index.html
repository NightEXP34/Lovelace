<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor</title>
<style>
/* Themes: add a [data-theme="name"] block that overrides these tokens. */
:root{
  --bg:#f2f3f5;--surface:#fff;--line:#e2e4e9;--ink:#15171c;--mute:#6a7180;
  --a:#3b5bdb;--b:#e8590c;--ok:#2b9348;--warn:#e08a00;--bad:#d6336c;
  --r-panel:12px;--r-ctl:7px;
  --sans:"Inter","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"JetBrains Mono","SF Mono",Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#121418;--surface:#1a1d23;--line:#272b33;--ink:#e6e8ec;--mute:#8a909c;
  --a:#7f95ff;--b:#ff9b5e;--ok:#4cc16b;--warn:#f2a93b;--bad:#ff6b9d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 var(--sans);display:grid;grid-template-columns:170px minmax(0,1fr);min-height:100vh}
nav{padding:20px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav h1{font-size:15px;margin:0 8px 18px;font-weight:650}
nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:var(--r-ctl);color:var(--mute)}
nav button:hover{color:var(--ink)}
nav button[aria-current=true]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
nav button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--mute)}
select,input,.btn{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);padding:6px 10px}
.btn{cursor:pointer}.btn:disabled,input:disabled{opacity:.5;cursor:not-allowed}
main{padding:12px 14px;min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:15px;margin:0 12px 0 0;font-weight:650}
.chip{font-size:13px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--mute)}
.chip b{color:var(--ink);font-weight:500}.chip.warn b{color:var(--warn)}
.grow{flex:1}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,19vw,330px);gap:10px;min-height:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px;min-height:0}
.p,.rc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:16px 18px;min-height:0;overflow:hidden}
.p{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px 18px}
.p header{grid-column:1/-1;display:flex;align-items:baseline;gap:10px}
.p h2,.rc h2{font-size:16px;margin:0;font-weight:650}
.p header span{color:var(--mute);font-size:13px}
.col{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:0;min-height:0}
.hd{display:flex;gap:14px;align-items:center}
.gw{flex:none;width:clamp(120px,min(9.5vw,15vh),160px)}.gw svg{width:100%;display:block}
.stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;min-width:0}
.stats span{display:block;font-size:12px;color:var(--mute)}
.stats b{font:600 21px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.stats small{font:12px var(--sans);color:var(--mute);font-weight:400;margin-left:2px}
.stats .na,.dd-na{font:400 13px/1.2 var(--mono);color:var(--mute)}
.na,.dd-na,[title]{cursor:help}
.hint2{font-size:12px;color:var(--mute)}
.cores>div{display:flex;gap:5px;margin-bottom:5px}
.cc{flex:1;height:clamp(42px,5.2vh,60px);background:var(--bg);border-radius:5px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.cc i{position:absolute;left:0;right:0;bottom:0;background:var(--a);opacity:.28;transition:height .6s}
.cores>div+div .cc i{background:var(--b)}
.cc b{font-size:11px;color:var(--mute);font-weight:500;position:relative}
.cc u{text-decoration:none;font:600 15px var(--mono);position:relative}
.cc s{text-decoration:none;font-size:11px;color:var(--mute);position:relative}
.bars{display:flex;flex-direction:column;gap:8px}
.br{display:grid;grid-template-columns:96px 1fr;gap:0 8px;align-items:center}
.br span{color:var(--mute);font-size:12px}
.bar{height:10px;background:var(--bg);border-radius:4px;overflow:hidden;display:flex}
.bar i{height:100%;display:block;transition:width .6s}
.br em{grid-column:2;font:normal 12px var(--mono);color:var(--mute);margin-top:2px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.cp{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.cp.on{border-color:var(--warn);color:var(--warn)}
.ch{display:flex;flex-direction:column;flex:1;min-height:0;gap:6px}
.tabs{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;font-size:13px;padding:4px 10px;border-radius:5px;color:var(--mute)}
.tabs button[aria-pressed=true]{background:var(--bg);color:var(--ink)}
.tabs .lg{margin-left:auto;font-style:normal;font-size:12px;color:var(--mute);display:flex;gap:8px}
.lg i{display:inline-block;width:8px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
svg.sp{width:100%;flex:1;min-height:90px;display:block}
svg path.l{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke}
dl{display:grid;gap:7px 14px;margin:0;font-size:13px;margin-top:auto}
dl.pr{grid-template-columns:auto 1fr}
dl.tb{grid-template-columns:auto 1fr 1fr}
dt{color:var(--mute)}dt.h{color:var(--ink);font-weight:600;text-align:right}
dd{margin:0;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
dd.warn{color:var(--warn)}
aside{display:flex;flex-direction:column;gap:10px;min-height:0}
.rc{display:flex;flex-direction:column;gap:10px}
.rc h2{font-size:15px}
.rc.tl{flex:1}
.tr{flex:1;display:grid;grid-template-columns:84px 1fr 60px;gap:8px;align-items:center;min-height:24px;border-bottom:1px solid var(--line)}
.tr:last-child{border:0}
.tr span{color:var(--mute);font-size:12px}.tr b{font:600 13px var(--mono);text-align:right}
.tr svg{width:100%;height:100%;min-height:20px}
.ev{display:grid;grid-template-columns:8px 56px 1fr;gap:8px;align-items:center;font-size:12px;height:18px}
.ev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev i{width:7px;height:7px;border-radius:50%;background:var(--ok)}.ev i.w{background:var(--warn)}
.ev time{color:var(--mute);font-family:var(--mono)}
.hint{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
.hint i{width:8px;height:8px;border-radius:50%;background:var(--ok)}.hint.warn i{background:var(--warn)}
/* ---- log tab ---- */
.bar-top{display:flex;gap:10px;align-items:center;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mute);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
table.n td:not(:first-child),table.n th:not(:first-child){text-align:right}
table.n td:not(:first-child){font-family:var(--mono)}
tr.grp td{background:var(--bg);font-weight:600}
.empty{color:var(--mute);text-align:center;padding:48px 0}
.stack{display:grid;gap:16px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.ctl{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--mute)}
.ctl label{display:flex;align-items:center;gap:8px}
.ctl select,.fld{height:34px}
.fld{display:inline-flex;align-items:center;gap:4px;padding:0 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);color:var(--mute)}
.fld:focus-within{outline:2px solid var(--a);outline-offset:2px}
.fld input{width:38px;height:100%;padding:0;border:0;background:transparent;text-align:right;font-family:var(--mono);outline:0;-moz-appearance:textfield;appearance:textfield}
.fld input::-webkit-inner-spin-button,.fld input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
svg.sp.lg{height:200px;flex:none}
input[type=checkbox]{accent-color:var(--a)}
.timer{font-family:var(--mono);color:var(--mute);min-width:52px}
.btn.on{background:var(--bad);border-color:var(--bad);color:#fff}
.hint.lg{color:var(--mute);font-size:12px;margin-top:8px}
@media(max-width:1100px),(max-height:760px){html,body{height:auto}main{grid-template-rows:auto auto auto}
 .wrap{grid-template-columns:1fr}.grid{grid-template-columns:1fr;grid-template-rows:none}.p{overflow:visible}aside{display:grid}.tr{min-height:30px}}
@media(max-width:900px){body{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}nav h1{width:100%;margin-bottom:6px}.foot{margin:0 0 0 auto;flex-direction:row}}
</style>
</head>
<body>
<nav id="nav"><h1>Monitor</h1>
  <button data-p="overview">Overview</button>
  <button data-p="log">Log</button>
  <div class="foot"><label>Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label><span id="status">Backend: offline</span></div>
</nav>
<main id="root"></main>
<script>
const $=s=>document.querySelector(s), clamp=(v,a,b)=>Math.min(b,Math.max(a,v)), avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const fx=(v,d=0)=>typeof v==="number"?v.toFixed(d):"unavailable";
const val=(v,d=0)=>typeof v==="number"?v.toFixed(d):"—";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss=t=>String(t/60|0).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
const mk=h=>{const d=document.createElement("div");d.innerHTML=h;return d};

const th=$("#theme"); th.value=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
(th.onchange=()=>document.documentElement.dataset.theme=th.value)();

/* ---- live sampler: fetch the collector API every second ---- */
let S={snap:{},drives:[{},{}]}, H={}, R={}, cur=[], online=false, rec=null;
async function sample(){
  try{
    const r=await fetch("/api/snapshot",{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    S={drives:[],snap:{},...d};
    online=true; $("#status").textContent="Backend: live";
    for(const k in d){const v=d[k];
      if(typeof v==="number"){(H[k]=H[k]||[]).push(v); if(H[k].length>60)H[k].shift()}
    }
    buildPanels();
    cur.forEach(x=>x.up());
    refreshSubs(); rail(); chipsTop();
  }catch(e){
    online=false; $("#status").textContent="Backend: offline — run server.py";
    chipsTop();
  }
}
setInterval(sample,1000); sample();
async function health(){
  try{const r=await fetch("/api/health",{cache:"no-store"});if(!r.ok)throw new Error(r.status);
    R=(await r.json()).items||{};}catch(e){/* backend offline: keep last reasons */}
}
setInterval(health,5000); health();

function spark(svg,keys,cols,min){
  const pairs=keys.map((k,i)=>[H[k]||[],cols[i]]).filter(([d])=>d.length>1);
  if(!pairs.length){svg.innerHTML="";return}
  const all=pairs.flatMap(([d])=>d), mn=min??Math.min(...all), span=(Math.max(...all)-mn)||1, h=svg.viewBox.baseVal.height;
  svg.innerHTML=pairs.map(([d,c])=>`<path class="l" style="stroke:var(${c})" d="${d.map((v,j)=>`${j?"L":"M"}${(j/Math.max(d.length-1,1)*200).toFixed(1)},${(h-2-(v-mn)/span*(h-4)).toFixed(1)}`).join("")}"/>`).join("");
}

/* skala gauge dari DATA NYATA (ring buffer 60 sampel + nilai terkini), bukan konstanta */
const dynMax=k=>{const arr=H[k]||[],cur=S[k];const all=arr.concat(typeof cur==="number"?[cur]:[]);
  return all.length?Math.max(...all):null};

/* ---- rpm-style gauge: 270° sweep; skala + ambang dari sumber nyata ---- */
const pt=(a,r)=>[75+r*Math.cos(a*Math.PI/180),66+r*Math.sin(a*Math.PI/180)];
const arc=(a0,a1,r)=>{const p=pt(a0,r),q=pt(a1,r);return`M${p[0].toFixed(1)},${p[1].toFixed(1)}A${r},${r} 0 ${a1-a0>180?1:0} 1 ${q[0].toFixed(1)},${q[1].toFixed(1)}`};
function gauge(g){
  const ring=(r,w,c)=>`<path d="${arc(135,405,r)}" fill="none" style="stroke:var(--line)" stroke-width="${w}" stroke-linecap="round"/><path class="${c}" fill="none" stroke-width="${w}" stroke-linecap="round"/>`;
  const el=mk(`<svg viewBox="0 0 150 124">${ring(54,9,"v")}${g.in?ring(41,5,"w"):""}<text x="75" y="72" text-anchor="middle" style="fill:var(--ink);font:600 24px var(--mono)"></text><text x="75" y="88" text-anchor="middle" style="fill:var(--mute);font:11px var(--sans)">${g.unit}</text><text x="75" y="118" text-anchor="middle" style="fill:var(--mute);font:11px var(--sans)">${g.label}</text></svg>`);
  const v=el.querySelector(".v"), w=el.querySelector(".w"), tx=el.querySelector("text");
  const draw=(p,x,m,wn,bd,r)=>{
    if(typeof x!=="number"||typeof m!=="number"||m<=0){p.setAttribute("d","");return}
    p.setAttribute("d",arc(135,135+270*clamp(x/m,.005,1),r));
    p.style.stroke=bd?"var(--bad)":wn?"var(--warn)":"var(--a)";
  };
  return{el,up:()=>{
    const x=S[g.key], m=g.max?g.max():dynMax(g.key);
    draw(v,x,m,g.warn(S),g.bad(S),54);
    tx.textContent=val(x,g.d||0); tx.setAttribute("title",x==null?(R[g.key]||"tidak ada sumber data"):"");
    if(g.in){const ix=S[g.in.key], im=g.in.max?g.in.max():dynMax(g.in.key);
      draw(w,ix,im,g.in.warn(S),g.in.bad(S),41);
      el.querySelector("svg").setAttribute("title",ix==null?(R[g.in.key]||""):"")}
  }};
}

/* ---- blocks: each returns {el, up()} ---- */
const B={
 hd:b=>{const g=gauge(b.g),el=mk(`<div class="hd"><div class="gw"></div><div class="stats">${b.stats.map(s=>`<div><span>${s[1]}</span><b></b></div>`).join("")}</div></div>`);
  el.querySelector(".gw").append(g.el);const bs=[...el.querySelectorAll("b")];
  return{el,up:()=>{g.up();b.stats.forEach((s,i)=>{
    const v=s[4]?s[4](S):S[s[0]];
    if(typeof v==="number"){bs[i].innerHTML=fx(v,s[3]||0)+`<small>${s[2]||""}</small>`;bs[i].removeAttribute("title")}
    else{bs[i].innerHTML=`<span class="na">${v==null?"unavailable":v}</span>`;
      bs[i].title=v==null?(R[s[0]]||"tidak ada sumber data"):"tidak ada I/O di interval ini"}
  })}}},
 cores:()=>{const el=mk(`<div></div>`);el.className="cores";
  return{el,up:()=>{
    const P=S.pu||[],E=S.eu||[];
    if(el.dataset.n!==String(P.length+E.length)){
      const cell=(p,k)=>`<div>${[...Array(k)].map((_,i)=>`<div class="cc"><i></i><b>${p}${i}</b><u></u><s></s></div>`).join("")}</div>`;
      el.innerHTML=cell("P",P.length)+cell("E",E.length)+`<div class="hint2">GHz dan °C per core dari snapshot. Fill = utilisasi. "—" = tidak ada sumber.</div>`;
      el.dataset.n=String(P.length+E.length);
    }
    const cc=[...el.querySelectorAll(".cc")];
    cc.forEach((x,i)=>{
      const src=i<P.length?[S.pf[i],S.pt[i],S.pu[i]]:[S.ef[i-P.length],S.et[i-P.length],S.eu[i-P.length]];
      const u=x.querySelector("i"),f=x.querySelector("u"),t=x.querySelector("s");
      u.style.height=(typeof src[2]==="number"?src[2]:0)+"%";
      f.textContent=val(src[0],2); f.title=src[0]==null?(R["pfa"]||R["ef"]||"tidak ada sumber clock"):"";
      t.textContent=val(src[1])+"°"; t.title=src[1]==null?(R["pt"]||"tidak ada sensor suhu core ini"):"";
    });
  }}},
 bars:b=>{const el=mk(`<div class="bars">${b.items.map(it=>`<div class="br"><span>${it.l}</span><div class="bar">${it.c.map(c=>`<i style="background:var(${c})"></i>`).join("")}</div><em></em></div>`).join("")}</div>`);
  const rows=[...el.querySelectorAll(".br")];
  return{el,up:()=>b.items.forEach((it,i)=>{
    // f() mengembalikan [v0, v1, ..., den] dengan den = penyebut nyata (limit dari snapshot / peak terukur)
    const f=it.f(S), den=f[f.length-1];
    rows[i].querySelectorAll(".bar i").forEach((x,j)=>{
      const ok=typeof f[j]==="number"&&typeof den==="number"&&den>0;
      x.style.width=ok?clamp(f[j]/den*100,0,100)+"%":"0%"});
    rows[i].querySelector("em").textContent=it.t(S);
    rows[i].querySelector("em").title=it.tip?it.tip(S):"";
  })};
 },
 chips:b=>{const el=mk(`<div class="chips">${b.items.map(x=>`<span class="cp">${x}</span>`).join("")}</div>`);
  const c=[...el.querySelectorAll(".cp")];
  return{el,up:()=>{
    b.on(S).forEach((raw,i)=>{
      const v=raw===true||raw===false?raw:null;
      c[i].className="cp"+(v===true?" on":"");
      c[i].textContent=b.items[i]+(v===null?" —":"");
      c[i].setAttribute("title",v===null?(b.tip?b.tip(S,i):"tidak ada sumber (NVML)"):"NVML throttle reasons")});
  }}},
 chart:b=>{let ti=0;const el=mk(`<div class="ch"><div class="tabs">${b.tabs.map(x=>`<button>${x.n}</button>`).join("")}<em class="lg"></em></div><svg class="sp" viewBox="0 0 200 50" preserveAspectRatio="none"></svg></div>`);
  const sv=el.querySelector("svg"),btn=[...el.querySelectorAll("button")],lg=el.querySelector(".lg");
  const draw=()=>spark(sv,b.tabs[ti].s.map(s=>s[0]),b.tabs[ti].s.map(s=>s[2]),b.tabs[ti].min);
  const tab=i=>{ti=i;btn.forEach((x,j)=>x.setAttribute("aria-pressed",j===i));lg.innerHTML=b.tabs[i].s.map(s=>`<span><i style="background:var(${s[2]})"></i>${s[1]}</span>`).join("");draw()};
  btn.forEach((x,i)=>x.onclick=()=>tab(i));tab(0);return{el,up:draw}},
 dl:b=>{const hdr=b.hdr?`<dt></dt>${b.hdr.map(h=>`<dt class="h">${h}</dt>`).join("")}`:"";
  const el=mk(`<dl class="${b.hdr?"tb":"pr"}">${hdr}${b.rows.map(r=>`<dt>${r[0]}</dt>`+(b.hdr?"<dd></dd><dd></dd>":"<dd></dd>")).join("")}</dl>`);
  const dd=[...el.querySelectorAll("dd")];
  // format row: pr [label, fn, warnFn|null, key] · tb [label, fn0, fn1, warnFn|null, key0, key1]
  return{el,up:()=>{let j=0;
    b.rows.forEach(r=>{
      const n=b.hdr?2:1;
      const warn=r[n+1]?r[n+1](S):false;
      for(let c=0;c<n;c++){
        const raw=r[1+c], v=typeof raw==="function"?raw(S):raw;
        const na=v==null||v==="unavailable";
        dd[j].textContent=na?"unavailable":v;
        dd[j].className=(warn?"warn ":"")+(na?"dd-na":"");
        dd[j].title=na?(R[r[n+2+c]]||"tidak ada sumber data"):"";
        j++;
      }
    })}};
  },
 /* block dinamis: jumlah item/kolom mengikuti snapshot (mis. jumlah drive dari /sys/block) */
 dynBars:b=>{const el=mk(`<div class="bars"></div>`), box=el.firstElementChild;let n=-1,rows=[];
  return{el,up:()=>{
    const items=b.items(S);
    if(items.length!==n){
      n=items.length;
      box.innerHTML=items.map(it=>`<div class="br"><span>${it.l}</span><div class="bar">${it.c.map(c=>`<i style="background:var(${c})"></i>`).join("")}</div><em></em></div>`).join("");
      rows=[...box.querySelectorAll(".br")];
    }
    items.forEach((it,i)=>{
      const f=it.f(S), den=f[f.length-1];
      rows[i].querySelectorAll(".bar i").forEach((x,j)=>{
        const ok=typeof f[j]==="number"&&typeof den==="number"&&den>0;
        x.style.width=ok?clamp(f[j]/den*100,0,100)+"%":"0%";
      });
      rows[i].querySelector("em").textContent=it.t(S);
      rows[i].querySelector("em").setAttribute("title",it.tip?it.tip(S):"");
    });
  }};
 },
 dynTable:b=>{const el=mk(`<dl class="tb"></dl>`), box=el.firstElementChild;let n=-1,dd=[];

function push(k,on,onMsg,offMsg){

function chipsTop(){
  const be=$("#c-be"); if(be){be.innerHTML=`Backend <b>${online?"live":"offline"}</b>`;be.className="chip"+(online?"":" warn")}
  const tc=$("#c-thr");
  if(tc){const thr=S.thr==null?"unavailable":S.thr;
    tc.innerHTML=`Throttle <b>${thr}</b>`;tc.className="chip"+(S.thr!=null&&S.thr!=="none"?" warn":"");
    tc.title=S.thr==null?(R["thr"]||"tidak ada sumber data"):""}
  const lc=$("#c-link");
  if(lc){const now=S.pcieGen==null?"—":"Gen"+S.pcieGen+" x"+S.pcieWidth;
    lc.innerHTML=`GPU link <b>${now}${S.pcieMax?" → "+S.pcieMax:""}</b>`;
    lc.title=S.pcieGen==null?(R["pcieGen"]||"tidak ada sumber data"):"link sekarang bisa turun saat idle (normal)"}
  const rc2=$("#c-rec");
  if(rc2){rc2.innerHTML=`Recording <b>${rec?("on "+(rec.samples||0)+" samples"):"off"}</b>`;
    rc2.className="chip"+(rec?" warn":"")}
  const h=$("#hint"); if(!h)return;
  const rules=[];
  const rd=Math.max(-1,...(S.drives||[]).map((d,i)=>typeof S["r"+i]==="number"?S["r"+i]:-1));
  if(rd>600&&typeof S.gU==="number"&&S.gU<50){rules.push(`page-bound: NVMe read ${fx(Math.max(rd,0))} MB/s (> 600) dan GPU util ${fx(S.gU)} % (< 50)`)}
  if(S.thrThermal===true||cpuThrottling(S)){rules.push(`thermal-bound: throttle NVML=${S.thr}, CPU sysfs=${S.cpuThr?? "unavailable"}`)}
  if(near(S.gW,gLim(S),.95)){rules.push(`power-bound: GPU draw ${fx(S.gW,1)} W ≥ 95% limit NVML ${fx(gLim(S),0)} W`)}
  const w=rules.length>0;
  h.className="hint"+(w?" warn":"");
  h.querySelector("span").textContent=(w?rules.join(" · ")+" (aturan di atas dievaluasi dari data snapshot)":"Tidak ada aturan bottleneck yang picu (page-bound >600 MB/s + GPU <50%; thermal-bound dari throttle NVML/sysfs; power-bound ≥95% limit).");
}

function st(a){
  const v=a.filter(x=>typeof x==="number");
  if(!v.length)return null;
  const s=[...v].sort((x,y)=>x-y),m=avg(v);
  return{mean:m,med:s[s.length>>1],p95:s[Math.floor(s.length*.95)],sd:Math.sqrt(avg(v.map(x=>(x-m)**2))),min:s[0],max:s[v.length-1]};

async function loadSessions(){

  if(rec){const s=SES.find(x=>x.id===rec.id); if(s){rec.samples=s.samples; rec.mk=(s.markers||[]).length}}

async function toggleRec(){
  if(!rec){
    const iv=+$("#iv").value;

      body:JSON.stringify({label:$("#lb").value.trim(),tag:$("#tg").value.trim(),interval:iv})});
    rec=await r.json(); rec.iv=iv; rec.samples=0; rec.mk=0;
    sel.add(rec.id);
    await loadSessions();
    rec.timer=setInterval(async()=>{
      if(!rec)return;
      await loadSessions();
      const t=$("#tm"); if(t)t.textContent=mmss(Math.round((rec.samples||0)*rec.iv));
      chipsTop();
    },1000);
  } else {
    await fetch("/api/log/stop",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({id:rec.id})});
    clearInterval(rec.timer);
    rec=null; await loadSessions();
  }
  chipsTop(); renderLog();
}
async function addMarker(){
  if(!rec)return;
  await fetch("/api/log/marker",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({id:rec.id})});
  await loadSessions();
  const e=$("#mk"); if(e)e.textContent="Add marker ("+(rec.mk||0)+")";
}
async function loadCsv(id){
  if(CSV[id])return CSV[id];
  const r=await fetch(`/api/log/${id}/samples.csv`);
  if(!r.ok)return null;
  const txt=await r.text();
  const d={ts:[],...Object.fromEntries(METRICS.map(([k])=>[k,[]]))};
  txt.split("\n").slice(1).forEach(ln=>{
    if(!ln)return;
    const p=ln.split(",");
    d.ts.push(+p[0]);
    METRICS.forEach(([k],i)=>{const v=p[i+1]; d[k].push(v===undefined||v===""?null:+v)});
  });
  CSV[id]=d; return d;
}
async function exportCsv(){
  for(const s of SES.filter(x=>sel.has(x.id))){
    const r=await fetch(`/api/log/${s.id}/samples.csv`);
    const t=await r.text();
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"})); a.download=s.label+".csv"; a.click();
  }
}
async function renderLog(){
  await loadSessions();
  const root=$("#root"), r=!!rec;
  const rows=SES.map(s=>`<tr><td><input type="checkbox" data-id="${s.id}" ${sel.has(s.id)?"checked":""} aria-label="Select ${esc(s.label)}"></td><td>${esc(s.label)}${s.status==="recording"?' <span class="tag">recording</span>':""}</td><td><span class="tag">${esc(s.tag||"none")}</span></td><td>${esc(s.started_iso||String(s.start_ms))}</td><td>${mmss(Math.round(s.samples*(s.interval_s||1)))}</td><td>${s.interval_s} s</td><td>${s.samples}</td><td>${(s.markers||[]).length}</td><td><button class="btn" data-del="${s.id}">Delete</button></td></tr>`).join("");
  root.innerHTML=`<div class="bar-top"><input id="lb" placeholder="Session label" size="22" value="${esc(lo.lb)}"><input id="tg" placeholder="Tag (groups repeated runs)" size="24" value="${esc(lo.tg)}">
    <label>Interval <select id="iv" ${r?"disabled":""}>${[.5,1,5].map(v=>`<option value="${v}" ${v===(r?rec.iv:lo.iv)?"selected":""}>${v} s</option>`).join("")}</select></label>
    <button class="btn ${r?"on":""}" id="rc">${r?"Stop and save":"Start recording"}</button><span class="timer" id="tm">${r?mmss(Math.round((rec.samples||0)*rec.iv)):"00:00"}</span>
    <button class="btn" id="mk" ${r?"":"disabled"}>Add marker${r?" ("+(rec.mk||0)+")":""}</button><span class="grow"></span><button class="btn" id="ex" ${sel.size?"":"disabled"}>Export CSV</button></div>
    <div class="stack"><section class="p" style="display:block"><h2>Sessions</h2><div class="sub" style="margin:2px 0 16px">${SES.length} tersimpan di server (folder logs/). Interval & marker ikut tersimpan di meta.json.</div>
    ${SES.length?`<table><tr><th></th><th>Name</th><th>Tag</th><th>Started</th><th>Length</th><th>Interval</th><th>Samples</th><th>Markers</th><th></th></tr>${rows}</table>`:`<div class="empty">No logs yet. Start a recording to create one.</div>`}</section>
    <section class="p" style="display:block"><h2>Analysis</h2><div class="sub" id="asub" style="margin:2px 0 16px">0 selected</div><div id="an"><div class="empty">Select one or more sessions above to analyze them.</div></div></section></div>`;
  $("#lb").oninput=e=>lo.lb=e.target.value; $("#tg").oninput=e=>lo.tg=e.target.value; $("#iv").onchange=e=>lo.iv=+e.target.value;
  $("#rc").onclick=toggleRec; $("#ex").onclick=exportCsv; $("#mk").onclick=addMarker;
  root.querySelectorAll("[data-id]").forEach(c=>c.onchange=()=>{const id=+c.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);renderLog()});
  root.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{const id=+b.dataset.id;
    await fetch(`/api/log/${id}`,{method:"DELETE"}); sel.delete(id); delete CSV[id]; await loadSessions(); renderLog()});
  const ss=SES.filter(s=>sel.has(s.id));
  $("#asub").textContent=ss.length+" selected";
  if(!ss.length)return;
  const cs=await Promise.all(ss.map(s=>loadCsv(s.id)));
  const M=METRICS.find(x=>x[0]===lo.m);
  const arrs=cs.map(c=>c?c[lo.m].slice(Math.round(lo.trim/(ss[0].interval_s||1))).filter(v=>typeof v==="number"):[]);
  const S2=arrs.map(st);
  const line=(l,x,c)=>`<tr${c?' class="grp"':""}><td>${l}</td>${["mean","med","p95","sd","min","max"].map(k=>`<td>${x?f2(x[k]):"unavailable"}</td>`).join("")}</tr>`;
  let tb=ss.map((s,i)=>line(`<i style="display:inline-block;width:10px;height:3px;border-radius:2px;background:var(${COL[i%5]});margin-right:8px;vertical-align:middle"></i>${esc(s.label)}`,S2[i])).join("");
  if(lo.grp){
    const g={};ss.forEach((s,i)=>{if(S2[i])(g[s.tag||"none"]=g[s.tag||"none"]||[]).push(S2[i])});
    Object.entries(g).filter(([,v])=>v.length>1).forEach(([t,v])=>{const m=k=>avg(v.map(x=>x[k]));
      tb+=line(`Average of ${v.length} runs (${esc(t)})`,{mean:m("mean"),med:m("med"),p95:m("p95"),sd:st(v.map(x=>x.mean)).sd,min:Math.min(...v.map(x=>x.min)),max:Math.max(...v.map(x=>x.max))},1)});
  }
  const flat=o=>{const r={};const walk=(v,p)=>{if(v&&typeof v==="object"){for(const k in v)walk(v[k],p?p+"."+k:k)}else r[p]=v};walk(o,"");return r};
  const cfgs=ss.map(s=>({...flat(s.config||{}),tag:s.tag||"none",interval_s:s.interval_s}));
  const keys=[...new Set(cfgs.flatMap(c=>Object.keys(c)))].filter(k=>new Set(cfgs.map(c=>JSON.stringify(c[k]))).size>1);
  const hasData=arrs.some(a=>a.length);
  $("#an").innerHTML=`<div class="ctl"><label>Metric <select id="mt">${METRICS.map(m=>`<option value="${m[0]}" ${m[0]===lo.m?"selected":""}>${m[1]} (${m[2]})</option>`).join("")}</select></label>
    <label>Skip first <span class="fld"><input type="number" id="tr" min="0" step="5" value="${lo.trim}" aria-label="Seconds to skip"><em>s</em></span></label>
    <label><input type="checkbox" id="gp" ${lo.grp?"checked":""}> Average runs with the same tag</label></div>
    ${hasData?`<svg class="sp lg" id="ov" viewBox="0 0 200 60" preserveAspectRatio="none"></svg>`:""}
    <div class="hint lg">${M[1]} (${M[2]}) dari CSV server. ${hasData?"Sample yang di-skip tidak masuk chart/statistik. Marker tersimpan di meta.json.":"Tidak ada sample untuk metrik ini — mungkin unavailable di mesin ini."}</div>
    <h3 style="margin-top:18px">Statistics</h3><table class="n"><tr><th>Session</th><th>Mean</th><th>Median</th><th>p95</th><th>Std dev</th><th>Min</th><th>Max</th></tr>${tb}</table>
    ${lo.grp?`<div class="hint lg">Untuk baris average, std dev = spread antar run.</div>`:""}
    <h3 style="margin-top:18px">Perbedaan konfigurasi sesi</h3>${keys.length?`<table class="n"><tr><th>Field</th>${ss.map(s=>`<th>${esc(s.label)}</th>`).join("")}</tr>${keys.map(k=>`<tr><td>${k}</td>${cfgs.map(c=>`<td>${esc(String(c[k]))}</td>`).join("")}</tr>`).join("")}</table>`:`<div class="hint lg">Semua sesi terpilih punya konfigurasi (governor/EPP/turbo/sysctl/power limit) yang sama.</div>`}`;
  $("#mt").onchange=e=>{lo.m=e.target.value;renderLog()}; $("#tr").onchange=e=>{lo.trim=Math.max(0,+e.target.value||0);renderLog()}; $("#gp").onchange=e=>{lo.grp=e.target.checked;renderLog()};
  const ov=$("#ov");
  if(ov) overlay(ov,arrs,ss.map(s=>s.interval_s||1));
}
function overlay(svg,arrs,ivs){
  const keep=arrs.map((a,i)=>[a,ivs[i]]).filter(([a])=>a.length>1);
  if(!keep.length){svg.innerHTML="";return}
  const all=keep.flatMap(([a])=>a),mn=Math.min(...all),sp=(Math.max(...all)-mn)||1,D=Math.max(...keep.map(([a,i])=>a.length*ivs[i]));
  svg.innerHTML=keep.map(([a,i])=>`<path class="l" style="stroke:var(${COL[i%5]})" d="${a.map((v,j)=>`${j?"L":"M"}${(j*ivs[i]/D*200).toFixed(1)},${(58-(v-mn)/sp*56).toFixed(1)}`).join("")}"/>`).join("");
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.p));
show(location.hash.slice(1));
</script>
