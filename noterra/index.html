<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor</title>
<style>
/* Themes: add a [data-theme="name"] block that overrides these tokens. */
:root{
  --bg:#f2f3f5;--surface:#fff;--line:#e2e4e9;--ink:#15171c;--mute:#6a7180;
  --a:#3b5bdb;--b:#e8590c;--ok:#2b9348;--warn:#e08a00;--bad:#d6336c;
  --r-panel:12px;--r-ctl:7px;
  --sans:"Inter","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"JetBrains Mono","SF Mono",Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#121418;--surface:#1a1d23;--line:#272b33;--ink:#e6e8ec;--mute:#8a909c;
  --a:#7f95ff;--b:#ff9b5e;--ok:#4cc16b;--warn:#f2a93b;--bad:#ff6b9d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);display:grid;grid-template-columns:170px 1fr;min-height:100vh}
nav{padding:20px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav h1{font-size:15px;margin:0 8px 18px;font-weight:650}
nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:var(--r-ctl);color:var(--mute)}
nav button:hover{color:var(--ink)}
nav button[aria-current=true]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
nav button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--mute)}
select,input,.btn{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);padding:6px 10px}
.btn{cursor:pointer}.btn:disabled,input:disabled{opacity:.5;cursor:not-allowed}
main{padding:22px 26px;max-width:1500px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.p{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:18px 20px;min-width:0}
.p>h2{font-size:16px;margin:0;font-weight:650}
.sub{color:var(--mute);font-size:12px;margin:2px 0 16px}
h3{font-size:12px;font-weight:600;color:var(--mute);margin:0 0 10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px 26px}
.big{display:flex;gap:24px;flex-wrap:wrap}
.big div span{display:block;font-size:12px;color:var(--mute)}
.big div b{font:600 22px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.big small{font:12px var(--sans);color:var(--mute);font-weight:400;margin-left:3px}
svg.sp{width:100%;height:84px;display:block}
svg.sp path{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0;font-size:13px}
dt{color:var(--mute)}dd{margin:0;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
dd.warn{color:var(--warn)}
.cr{display:grid;grid-template-columns:28px 58px 1fr 44px;gap:8px;align-items:center;padding:4px 0;font-size:12px;border-bottom:1px solid var(--line)}
.cr:last-child{border:0}
.cr span{font-family:var(--mono)}.cr span:first-child{color:var(--mute)}.cr span:last-child{text-align:right}
.bar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--a)}
.ec .bar i{background:var(--b)}
.bar-top{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.bar-top .grow{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mute);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line)}
.empty{color:var(--mute);text-align:center;padding:48px 0}
.stack{display:grid;gap:16px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.ctl{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--mute)}
.ctl label{display:flex;align-items:center;gap:8px}
.ctl select,.fld{height:34px}
.fld{display:inline-flex;align-items:center;gap:4px;padding:0 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);color:var(--mute)}
.fld:focus-within{outline:2px solid var(--a);outline-offset:2px}
.fld input{width:38px;height:100%;padding:0;border:0;background:transparent;text-align:right;font-family:var(--mono);outline:0;-moz-appearance:textfield;appearance:textfield}
.fld input::-webkit-inner-spin-button,.fld input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
svg.sp.lg{height:200px;margin-bottom:0}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
table.n td:not(:first-child),table.n th:not(:first-child){text-align:right}
table.n td:not(:first-child){font-family:var(--mono)}
tr.grp td{background:var(--bg);font-weight:600}
input[type=checkbox]{accent-color:var(--a)}
.timer{font-family:var(--mono);color:var(--mute);min-width:52px}
.btn.on{background:var(--bad);border-color:var(--bad);color:#fff}
.hint{color:var(--mute);font-size:12px;margin-top:8px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
@media(max-width:900px){body{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}nav h1{width:100%;margin-bottom:6px}.foot{margin:0 0 0 auto;flex-direction:row}}
@media(max-width:600px){.cols{grid-template-columns:1fr}.cols>*{grid-column:auto!important}}
</style>
</head>
<body>
<nav id="nav"><h1>Monitor</h1>
  <button data-p="overview">Overview</button>
  <button data-p="log">Log</button>
  <div class="foot"><label>Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label><span id="status">Backend: offline</span></div>
</nav>
<main id="root"></main>
<script>
const $=s=>document.querySelector(s), clamp=(v,a,b)=>Math.min(b,Math.max(a,v)), avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const fx=(v,d=0)=>typeof v==="number"?v.toFixed(d):"unavailable";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss=t=>String(t/60|0).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
const GT={1:2.5,2:5,3:8,4:16,5:32,6:64};

const th=$("#theme"); th.value=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
(th.onchange=()=>document.documentElement.dataset.theme=th.value)();

/* ---- live sampler: fetch the collector API every second ---- */
let S={snap:{},drives:[{},{}]}, H={}, cur=[], online=false;
async function sample(){
  try{
    const r=await fetch("/api/snapshot",{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    S={drives:[{},{}],snap:{},...d};
    online=true; $("#status").textContent="Backend: live";
    for(const k in d){const v=d[k];
      if(typeof v==="number"){(H[k]=H[k]||[]).push(v); if(H[k].length>60)H[k].shift()}
    }
    cur.forEach(x=>x.up());
    refreshSubs();
  }catch(e){
    online=false; $("#status").textContent="Backend: offline — run server.py";
  }
}
setInterval(sample,1000); sample();

function spark(svg,keys,cols,min){
  const pairs=keys.map((k,i)=>[H[k]||[],cols[i]]).filter(([d])=>d.length>1);
  if(!pairs.length){svg.innerHTML="";return}
  const all=pairs.flatMap(([d])=>d), mn=min??Math.min(...all), span=(Math.max(...all)-mn)||1, h=svg.viewBox.baseVal.height;
  svg.innerHTML=pairs.map(([d,c])=>`<path stroke="var(${c})" d="${d.map((v,j)=>`${j?"L":"M"}${(j/Math.max(d.length-1,1)*200).toFixed(1)},${(h-2-(v-mn)/span*(h-4)).toFixed(1)}`).join("")}"/>`).join("");
}

/* ---- parts: each returns {el, up()} ---- */
function part(b){
  const el=document.createElement("div"); el.style.gridColumn="span "+(b.span||1);
  const T=b.title?`<h3>${b.title}</h3>`:"";
  if(b.t==="stats"){
    el.innerHTML=T+`<div class="big">${b.items.map(x=>`<div><span>${x[1]}</span><b></b></div>`).join("")}</div>`;
    const bs=[...el.querySelectorAll("b")];
    return{el,up:()=>b.items.forEach((x,i)=>bs[i].innerHTML=fx(S[x[0]],x[3]||0)+`<small>${x[2]}</small>`)};
  }
  if(b.t==="chart"){
    el.innerHTML=T+`<svg class="sp" viewBox="0 0 200 60" preserveAspectRatio="none"></svg><div class="legend">${b.series.map(s=>`<span><i style="background:var(${s[2]})"></i>${s[1]}</span>`).join("")}</div>`;
    const sv=el.querySelector("svg");
    return{el,up:()=>spark(sv,b.series.map(s=>s[0]),b.series.map(s=>s[2]),b.min)};
  }
  if(b.t==="dl"){
    el.innerHTML=T+`<dl>${b.rows.map(r=>`<dt>${r[0]}</dt><dd></dd>`).join("")}</dl>`;
    const ds=[...el.querySelectorAll("dd")];
    return{el,up:()=>b.rows.forEach((r,i)=>{
      const v=typeof r[1]==="function"?r[1](S):r[1];
      ds[i].textContent=v==null?"unavailable":v;
      ds[i].className=r[2]&&r[2](S)?"warn":"";
    })};
  }
  if(b.t==="cores"){
    el.className=b.cls; el.innerHTML=T;
    let rows=[];
    return{el,up:()=>{
      const u=S[b.u]||[],f=S[b.f]||[],tp=S[b.T]||[];
      if(rows.length!==u.length){
        el.innerHTML=T+[...Array(u.length)].map((_,i)=>`<div class="cr"><span>${b.pre}${i}</span><span></span><div class="bar"><i></i></div><span></span></div>`).join("");
        rows=[...el.querySelectorAll(".cr")];
      }
      rows.forEach((r,i)=>{const c=r.children;
        c[1].textContent=fx(f[i],2)+" GHz";
        c[2].firstChild.style.width=(typeof u[i]==="number"?u[i]:0)+"%";
        c[3].textContent=fx(tp[i])+"°C"});
    }};
  }
}

/* ---- overview layout: one panel per component ---- */
const warnG=s=>s.thr!=null&&s.thr!=="none";
const drive=(i)=>[
  {t:"stats",span:2,title:`Drive ${i}: nvme${i}n1`,items:[["r"+i,"Read","MB/s"],["w"+i,"Write","MB/s",1],["i"+i,"Read+write IOPS"],["a"+i,"Await","ms",1]]},
  {t:"chart",title:"Throughput",min:0,series:[["r"+i,"Read","--a"],["w"+i,"Write","--b"]]},
  {t:"dl",title:"Device",rows:[
    ["Model",s=>s.drives[i].name],["Link",s=>s.drives[i].link],["Link max",s=>s.drives[i].linkMax],
    ["Size",s=>s.drives[i].sizeGB==null?"unavailable":fx(s.drives[i].sizeGB,1)+" GB"],
    ["Utilization",s=>fx(s["u"+i])+" %"],["Queue depth",s=>fx(s["q"+i],1)],
    ["Temperature",s=>fx(s["t"+i])+" °C"],
    ["Capacity used",s=>s.drives[i].capUsed==null?"unavailable":fx(s.drives[i].capUsed)+" %"],
    ["I/O scheduler",s=>s.drives[i].sched],["Readahead",s=>s.drives[i].readahead]]}];
const PANELS=[
 {title:"CPU",sub:s=>s.snap.cpuModel||"CPU",parts:[
  {t:"stats",span:2,items:[["cpuT","Package temp","°C"],["cpuW","Package power","W",1],["cpuU","Utilization","%"],["pfa","Avg P-core clock","GHz",2],["migr","Migrations","/s"]]},
  {t:"chart",title:"Temperature and power",series:[["cpuT","Temp (°C)","--b"],["cpuW","Power (W)","--a"]]},
  {t:"chart",title:"Load and idle",min:0,series:[["cpuU","Utilization (%)","--a"],["idle","Idle residency (%)","--b"]]},
  {t:"cores",title:"Performance cores",cls:"pc",pre:"P",u:"pu",f:"pf",T:"pt"},
  {t:"cores",title:"Efficiency cores",cls:"ec",pre:"E",u:"eu",f:"ef",T:"et"},
  {t:"dl",title:"Scheduler and power",rows:[
    ["Governor",s=>s.snap.governor],["EPP",s=>s.snap.epp],["Turbo",s=>s.snap.turbo],
    ["PL1 / PL2",()=>null],["Core pinning",s=>s.snap.pinning],["Driver",s=>s.snap.driver]]},
  {t:"dl",title:"Kernel activity",rows:[
    ["Context switches",s=>fx(s.ctx)+" /s"],["Thread migrations",s=>fx(s.migr)+" /s"],
    ["Interrupts",s=>fx(s.irq)+" /s"],
    ["Idle residency",s=>s.idle==null?"unavailable":fx(s.idle)+" % ("+s.idleName+")"],
    ["Throttle",s=>s.cpuThr]]}]},
 {title:"GPU",sub:s=>s.snap.nvml?"NVIDIA GPU (NVML)":"NVIDIA GPU (NVML unavailable)",parts:[
  {t:"stats",span:2,items:[["gT","Temperature","°C"],["gW","Power","W",1],["gClk","SM clock","MHz"],["gU","GPU util","%"],["vram","VRAM used","GB",1]]},
  {t:"chart",title:"Temperature and power",series:[["gT","Temp (°C)","--b"],["gW","Power (W)","--a"]]},
  {t:"chart",title:"Utilization",min:0,series:[["gU","GPU (%)","--a"],["gMU","Memory controller (%)","--b"]]},
  {t:"chart",title:"VRAM bandwidth in use",min:0,series:[["vbw","GB/s","--a"]]},
  {t:"chart",title:"PCIe traffic",min:0,series:[["prx","Receive (GB/s)","--a"],["ptx","Transmit (GB/s)","--b"]]},
  {t:"dl",title:"VRAM",rows:[
    ["Used / total",s=>s.vram==null?"unavailable":fx(s.vram,1)+" / "+fx(s.vramTot,1)+" GB"],
    ["Memory clock",s=>s.gMemClk==null?"unavailable":s.gMemClk+" MHz"],
    ["Bus width","128-bit (spec)"],["Peak bandwidth","256 GB/s (spec)"],
    ["Bandwidth in use",s=>s.vbw==null?"unavailable":fx(s.vbw)+" GB/s"],
    ["Controller util",s=>s.gMU==null?"unavailable":fx(s.gMU)+" %"]]},
  {t:"dl",title:"PCIe",rows:[
    ["Link now",s=>s.pcieGen==null?"unavailable":"Gen"+s.pcieGen+" x"+s.pcieWidth],
    ["Link max",()=>null],
    ["Receive",s=>s.prx==null?"unavailable":fx(s.prx,2)+" GB/s"],
    ["Transmit",s=>s.ptx==null?"unavailable":fx(s.ptx,2)+" GB/s"],
    ["Theoretical",s=>s.pcieGen==null?"unavailable":fx(GT[s.pcieGen]*(s.pcieWidth||0)/8*(s.pcieGen<=2?0.8:128/130),2)+" GB/s"],
    ["Link used",s=>s.pcu==null?"unavailable":fx(s.pcu)+" %"]]},
  {t:"dl",span:2,title:"Power and throttle",rows:[
    ["Draw / limit",s=>s.gW==null?"unavailable":fx(s.gW,1)+" W"+(s.gLim?" / "+fx(s.gLim)+" W":"")],
    ["SM clock max",s=>s.gClkMax==null?"unavailable":s.gClkMax+" MHz"],
    ["Fan",s=>s.fan==null?"unavailable":fx(s.fan)+" %"],
    ["P-state",s=>s.pstate],
    ["Throttle reason",s=>s.thr,warnG]]}]},
 {title:"Memory",sub:s=>(s.snap.kernel?"kernel "+s.snap.kernel:"")+((s.snap.gpuDriver)?` · NVIDIA ${s.snap.gpuDriver}`:""),parts:[
  {t:"stats",span:2,items:[["ramU","Used","GB",1],["cache","Page cache","GB",1],["avail","Available","GB",1],["majF","Major faults","/s"],["swp","Swap I/O","MB/s",1]]},
  {t:"chart",title:"RAM",min:0,series:[["ramU","Used (GB)","--a"],["cache","Page cache (GB)","--b"]]},
  {t:"chart",title:"Page faults",min:0,series:[["majF","Major (/s)","--b"],["minF","Minor (/s)","--a"]]},
  {t:"dl",title:"Capacity",rows:[
    ["Total",s=>fx(s.memTot,1)+" GB"],["Used",s=>fx(s.ramU,1)+" GB"],
    ["Page cache",s=>fx(s.cache,1)+" GB"],["Swap",s=>fx(s.swapU,1)+" / "+fx(s.swapTot)+" GB"],
    ["Transparent hugepages",s=>s.snap.thp],["Swappiness",s=>s.snap.swappiness]]},
  {t:"dl",title:"Bandwidth",rows:[
    ["Type","DDR5-5200 (spec)"],["Channels","2 (spec)"],["Theoretical peak","83.2 GB/s (spec)"],
    ["Measured bandwidth",()=>null],["Minor faults",s=>fx(s.minF)+" /s"]]}]},
 {title:"Storage",sub:"NVMe drives",parts:[...drive(0),...drive(1)]}
];

function show(id){
  if(id!=="log")id="overview"; location.hash=id; cur=[];
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.p===id));
  const root=$("#root");
  if(id==="log"){renderLog();return}
  root.innerHTML=`<div class="grid" id="g"></div>`;
  PANELS.forEach(p=>{
    const el=document.createElement("section"); el.className="p";
    el.innerHTML=`<h2>${p.title}</h2><div class="sub"></div><div class="cols"></div>`;
    const sub=el.querySelector(".sub");
    p.parts.forEach(b=>{const x=part(b); cur.push(x); el.lastChild.append(x.el)});
    $("#g").append(el);
    sub.textContent=(typeof p.sub==="function"?p.sub(S):p.sub)||"";
  });
  cur.forEach(x=>x.up());
}
function refreshSubs(){
  document.querySelectorAll("#g .sub").forEach((el,i)=>{
    const p=PANELS[i]; if(!p)return;
    el.textContent=(typeof p.sub==="function"?p.sub(S):p.sub)||"";
  });
}

/* ---- log ---- */
const METRICS=[["cpuT","CPU temp","°C","cpu_temp_c"],["cpuW","CPU power","W","cpu_power_w"],["gT","GPU temp","°C","gpu_temp_c"],["gW","GPU power","W","gpu_power_w"],["vbw","VRAM bandwidth","GB/s","vram_bw_gbs"],["prx","PCIe receive","GB/s","pcie_rx_gbs"],["majF","Major faults","/s","mem_major_faults_s"],["r0","NVMe 0 read","MB/s","nvme0_read_mbps"]];
const COL=["--a","--b","--ok","--warn","--bad"];
let LOG=[],sel=new Set(),rec=null,uid=0,lo={m:"cpuT",trim:0,grp:true,iv:1,lb:"",tg:""};
const snapNow=()=>({...S.snap});
const f2=v=>typeof v==="number"?fx(v,Math.abs(v)<10?2:1):"unavailable";
function st(a){
  const v=a.filter(x=>typeof x==="number");
  if(!v.length)return null;
  const s=[...v].sort((x,y)=>x-y),m=avg(v);
  return{mean:m,med:s[s.length>>1],p95:s[Math.floor(s.length*.95)],sd:Math.sqrt(avg(v.map(x=>(x-m)**2))),min:s[0],max:s[v.length-1]};
}
function toggleRec(){
  if(!rec){
    const iv=+$("#iv").value;
    rec={id:++uid,name:$("#lb").value.trim()||"session-"+uid,tag:$("#tg").value.trim(),iv,start:Date.now(),
      data:Object.fromEntries(METRICS.map(([k])=>[k,[]])),mk:0,snap:snapNow()};
    rec.h=setInterval(recTick,iv*1000); recTick();
  } else {
    clearInterval(rec.h);
    if(rec.data.cpuT.length>1){const{h,...s}=rec;LOG.unshift(s);sel.add(s.id)}
    rec=null;
  }
  renderLog();
}
async function recTick(){
  if(!rec)return;
  try{
    const r=await fetch("/api/snapshot",{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    METRICS.forEach(([k])=>{rec.data[k].push(typeof d[k]==="number"?d[k]:null)});
    const e=$("#tm");if(e)e.textContent=mmss(Math.round(rec.data.cpuT.length*rec.iv));
  }catch(e){/* backend offline: skip this tick */}
}
function exportCsv(){
  LOG.filter(s=>sel.has(s.id)).forEach(s=>{
    const head="timestamp_ms,"+METRICS.map(m=>m[3]).join(",");
    const body=s.data.cpuT.map((_,i)=>[s.start+Math.round(i*s.iv*1000),...METRICS.map(([k])=>s.data[k][i]==null?"":s.data[k][i].toFixed(3))].join(","));
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([head+"\n"+body.join("\n")+"\n"],{type:"text/csv"}));a.download=s.name+".csv";a.click();
  });
}
function renderLog(){
  const root=$("#root"), ss=LOG.filter(s=>sel.has(s.id)), M=METRICS.find(x=>x[0]===lo.m), r=!!rec;
  const rows=LOG.map(s=>`<tr><td><input type="checkbox" data-id="${s.id}" ${sel.has(s.id)?"checked":""} aria-label="Select ${esc(s.name)}"></td><td>${esc(s.name)}</td><td><span class="tag">${esc(s.tag||"none")}</span></td><td>${new Date(s.start).toLocaleString()}</td><td>${mmss(Math.round(s.data.cpuT.length*s.iv))}</td><td>${s.iv} s</td><td>${s.data.cpuT.length}</td><td>${s.mk}</td><td><button class="btn" data-del="${s.id}">Delete</button></td></tr>`).join("");
  let an=`<div class="empty">Select one or more sessions above to analyze them.</div>`, arrs=[];
  if(ss.length){
    arrs=ss.map(s=>s.data[lo.m].slice(Math.round(lo.trim/s.iv)).filter(v=>typeof v==="number"));
    const S2=arrs.map(st);
    const line=(l,x,c)=>`<tr${c?' class="grp"':""}><td>${l}</td>${["mean","med","p95","sd","min","max"].map(k=>`<td>${x?f2(x[k]):"unavailable"}</td>`).join("")}</tr>`;
    let tb=ss.map((s,i)=>line(`<i style="display:inline-block;width:10px;height:3px;border-radius:2px;background:var(${COL[i%5]});margin-right:8px;vertical-align:middle"></i>${esc(s.name)}`,S2[i])).join("");
    if(lo.grp){
      const g={};ss.forEach((s,i)=>{if(S2[i])(g[s.tag||"none"]=g[s.tag||"none"]||[]).push(S2[i])});
      Object.entries(g).filter(([,v])=>v.length>1).forEach(([t,v])=>{const m=k=>avg(v.map(x=>x[k]));
        tb+=line(`Average of ${v.length} runs (${esc(t)})`,{mean:m("mean"),med:m("med"),p95:m("p95"),sd:st(v.map(x=>x.mean)).sd,min:Math.min(...v.map(x=>x.min)),max:Math.max(...v.map(x=>x.max))},1)});
    }
    const keys=[...new Set(ss.flatMap(s=>Object.keys(s.snap)))].filter(k=>new Set(ss.map(s=>s.snap[k])).size>1);
    const hasData=arrs.some(a=>a.length);
    an=`<div class="ctl"><label>Metric <select id="mt">${METRICS.map(m=>`<option value="${m[0]}" ${m[0]===lo.m?"selected":""}>${m[1]} (${m[2]})</option>`).join("")}</select></label>
      <label>Skip first <span class="fld"><input type="number" id="tr" min="0" step="5" value="${lo.trim}" aria-label="Seconds to skip"><em>s</em></span></label>
      <label><input type="checkbox" id="gp" ${lo.grp?"checked":""}> Average runs with the same tag</label></div>
      ${hasData?`<svg class="sp lg" id="ov" viewBox="0 0 200 60" preserveAspectRatio="none"></svg>`:""}
      <div class="hint">${M[1]} (${M[2]}) over time. ${hasData?"Skipped samples are excluded from the chart and the statistics.":"No samples available for this metric — it may be unavailable on this machine."}</div>
      <h3 style="margin-top:18px">Statistics</h3><table class="n"><tr><th>Session</th><th>Mean</th><th>Median</th><th>p95</th><th>Std dev</th><th>Min</th><th>Max</th></tr>${tb}</table>
      ${lo.grp?`<div class="hint">For average rows, std dev is the spread between runs.</div>`:""}
      <h3 style="margin-top:18px">Configuration differences</h3>${keys.length?`<table class="n"><tr><th>Setting</th>${ss.map(s=>`<th>${esc(s.name)}</th>`).join("")}</tr>${keys.map(k=>`<tr><td>${k}</td>${ss.map(s=>`<td>${esc(s.snap[k])}</td>`).join("")}</tr>`).join("")}</table>`:`<div class="hint">All selected sessions have the same configuration.</div>`}`;
  }
  root.innerHTML=`<div class="bar-top"><input id="lb" placeholder="Session label" size="22" value="${esc(lo.lb)}"><input id="tg" placeholder="Tag (groups repeated runs)" size="24" value="${esc(lo.tg)}">
    <label>Interval <select id="iv" ${r?"disabled":""}>${[.5,1,5].map(v=>`<option value="${v}" ${v===lo.iv?"selected":""}>${v} s</option>`).join("")}</select></label>
    <button class="btn ${r?"on":""}" id="rc">${r?"Stop and save":"Start recording"}</button><span class="timer" id="tm">${r?mmss(Math.round(rec.data.cpuT.length*rec.iv)):"00:00"}</span>
    <button class="btn" id="mk" ${r?"":"disabled"}>Add marker${r?" ("+rec.mk+")":""}</button><span class="grow"></span><button class="btn" id="ex" ${sel.size?"":"disabled"}>Export CSV</button></div>
    <div class="stack"><section class="p"><h2>Sessions</h2><div class="sub">${LOG.length} recorded. Interval is saved with each session so comparisons stay fair.</div>
    ${LOG.length?`<table><tr><th></th><th>Name</th><th>Tag</th><th>Started</th><th>Length</th><th>Interval</th><th>Samples</th><th>Markers</th><th></th></tr>${rows}</table>`:`<div class="empty">No logs yet. Start a recording to create one.</div>`}</section>
    <section class="p"><h2>Analysis</h2><div class="sub">${ss.length} selected</div>${an}</section></div>`;
  $("#lb").oninput=e=>lo.lb=e.target.value; $("#tg").oninput=e=>lo.tg=e.target.value; $("#iv").onchange=e=>lo.iv=+e.target.value;
  $("#rc").onclick=toggleRec; $("#ex").onclick=exportCsv;
  $("#mk").onclick=()=>{rec.mk++;$("#mk").textContent="Add marker ("+rec.mk+")"};
  root.querySelectorAll("[data-id]").forEach(c=>c.onchange=()=>{const id=+c.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);renderLog()});
  root.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=+b.dataset.id;LOG=LOG.filter(s=>s.id!==id);sel.delete(id);renderLog()});
  if(ss.length){
    $("#mt").onchange=e=>{lo.m=e.target.value;renderLog()}; $("#tr").onchange=e=>{lo.trim=Math.max(0,+e.target.value||0);renderLog()}; $("#gp").onchange=e=>{lo.grp=e.target.checked;renderLog()};
    const ov=$("#ov");
    if(ov) overlay(ov,arrs,ss.map(s=>s.iv));
  }
}
function overlay(svg,arrs,ivs){
  const keep=arrs.map((a,i)=>[a,ivs[i]]).filter(([a])=>a.length>1);
  if(!keep.length){svg.innerHTML="";return}
  const all=keep.flatMap(([a])=>a),mn=Math.min(...all),sp=(Math.max(...all)-mn)||1,D=Math.max(...keep.map(([a,i])=>a.length*ivs[i]));
  svg.innerHTML=keep.map(([a,i])=>`<path stroke="var(${COL[i%5]})" d="${a.map((v,j)=>`${j?"L":"M"}${(j*ivs[i]/D*200).toFixed(1)},${(58-(v-mn)/sp*56).toFixed(1)}`).join("")}"/>`).join("");
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.p));
show(location.hash.slice(1));
</script>
</body>
</html>
